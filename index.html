<style>
  /* ==============================================================
     LAYOUT SHELL — read this before changing anything in here.

     The whole app is one fixed, full-screen flex column:

       .app      position:fixed; inset:0    <- exactly the visible viewport
         |- .scroll   flex:1; overflow-y:auto   <- the ONLY scrolling element
         |- .tabbar   flex:0 0 auto             <- a normal flex child

     Two consequences, and they are the whole point:

     1. The tab bar is a flex SIBLING of the scroll area, not
        position:fixed. Content therefore cannot render underneath it,
        so there is no bottom spacer and no magic clearance number to
        keep in sync. (The old build had a 120px spacer for a 92px bar
        = 62px of dead space at the bottom of every screen.)

     2. Nothing uses 100vh. On iOS, 100vh is the LARGE viewport — it
        ignores the browser chrome — so a 100vh shell is always taller
        than what you can actually see. position:fixed + inset:0 is
        sized to the visible viewport in both standalone and Safari.

     Safe areas are applied in exactly ONE place each:
        top    -> .scroll  padding-top
        bottom -> .tabbar  padding-bottom
     Do not add safe-area padding anywhere else, and do not floor the
     top inset to a magic minimum — env() is already 59px on a notched
     iPhone in standalone and 0 in Safari, which is correct both times.
     ============================================================== */

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; padding: 0; height: 100%; }

  body {
    background: #0E0E10;         /* behind the shell, so no white ever flashes */
    overscroll-behavior: none;   /* kill document rubber-banding */
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: #0E0E10;
  }

  .app {
    position: fixed;
    inset: 0;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: #F5F4EF;
    overflow: hidden;
  }

  .scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    overscroll-behavior-y: contain;
    -webkit-overflow-scrolling: touch;
    /* status-bar-style:default already keeps us below the clock/battery/
       camera, so this inset is 0 in standalone. The floor is just breathing
       room, and the inset still does the right thing if the style ever goes
       back to black-translucent. */
    padding-top: max(env(safe-area-inset-top), 10px);
    /* the last card must never sit flush against the tab bar */
    padding-bottom: 28px;
  }

  .tabbar {
    flex: 0 0 auto;
    display: flex;
    background: #0E0E10;
    border-radius: 16px 16px 0 0;
    /* Deliberately NOT env(safe-area-inset-bottom). Reserving the 34pt inset
       left the bottom third of this bar as empty black. Home Screen use only,
       so there is no Safari toolbar to clear — the bar hugs its labels with an
       zero padding. The bar's height is set entirely by tabBtn's `height` (70pt),
       which holds a 10px label sat two-thirds up (18pt padding-top against
       flex-start, putting the label's centre ~47pt off the bottom of 70pt). Comfortably clears the 44pt iOS touch-target minimum. */
    padding-bottom: 0;
  }

  input, button, select, textarea { font-family: inherit; }
  /* 16px minimum on inputs stops iOS from zooming the page on focus */
  input { font-size: 16px; }
</style>

// localStorage shim matching the window.storage API the app uses
window.storage = {
  get: async (key) => {
    const v = localStorage.getItem(key);
    if (v === null) throw new Error("not found");
    return { key, value: v };
  },
  set: async (key, value) => { localStorage.setItem(key, value); return { key, value }; },
  delete: async (key) => { localStorage.removeItem(key); return { key, deleted: true }; },
  list: async (prefix) => ({ keys: Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix)) }),
};

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

const SAVE_KEY = "gain-coach-v4";

const T = (h, m) => h * 60 + m;

// ================= GOAL =================
// You are a novice until your STRENGTH stalls, not until a date passes.
// Novice CNS adaptation lets you add weight most weeks, and muscle is being
// built at peak rate, which is what justifies the faster 1 lb/week gain.
// The moment weekly progression dies you are intermediate: muscle accrual
// slows, the same surplus starts buying fat, and the rate drops to 0.5.
// That transition is typically 6-12 months, and it is DETECTED below from
// liftHistory rather than assumed from the calendar.
const HEIGHT_CM = 182.9, AGE = 19, ACTIVITY = 1.6;
const maintenance = (lbs) => Math.round((10 * (lbs / 2.2046) + 6.25 * HEIGHT_CM - 5 * AGE + 5) * ACTIVITY);
const RATE = { novice: 1, intermediate: 0.5 };
// ~3,000 cal per lb of mixed tissue
const surplusFor = (rate) => Math.round((rate * 3000) / 7);
const calTargetFor = (lbs, rate) => maintenance(lbs) + surplusFor(rate);
const proteinFor = (lbs) => Math.round(lbs * 1.05);
// Intermediate strength standards, as multiples of bodyweight
const STANDARDS = [
  { id: "squat", name: "Squat", mult: 1.5 },
  { id: "bench", name: "Bench", mult: 1.25 },
  { id: "deadlift", name: "Deadlift", mult: 2.0 },
];
// No new all-time strength high in 21 days, with enough history to mean it.
const strengthStalled = (hist) => {
  if (!hist || hist.length < 6) return false;
  const cut = Date.now() - 21 * 864e5;
  const recent = hist.filter((p) => p.t >= cut);
  const older = hist.filter((p) => p.t < cut);
  if (!older.length || recent.length < 3) return false;
  return Math.max(...recent.map((p) => p.total)) <= Math.max(...older.map((p) => p.total));
};
const BASE_DAY_CAL = 3125;

// ================= FALL 2026 CLASSES =================
const SEMESTER = { start: "2026-08-31", end: "2026-12-19" };
const CLASSES = [
  { code: "RUSS-144", short: "Russian", days: { 1: [T(11, 20), T(12, 35)], 3: [T(11, 20), T(13, 0)], 4: [T(11, 20), T(12, 35)] } },
  { code: "WRT-100", short: "Writing", days: { 1: [T(12, 55), T(14, 10)], 4: [T(12, 55), T(14, 10)] } },
  { code: "JLC-104", short: "Justice", days: { 1: [T(14, 30), T(15, 45)], 4: [T(14, 30), T(15, 45)] } },
  { code: "STAT-202", short: "Stats", days: { 2: [T(14, 30), T(15, 45)], 3: [T(14, 30), T(15, 30)], 5: [T(14, 30), T(15, 45)] } },
  { code: "CORE-102", short: "Encounter", days: { 1: [T(17, 30), T(18, 45)] },
    onlyDates: ["2026-08-31", "2026-09-21", "2026-10-05", "2026-10-19", "2026-11-02", "2026-11-16", "2026-11-30"] },
];
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const classesOn = (d) => {
  const s = iso(d);
  if (s < SEMESTER.start || s > SEMESTER.end) return [];
  const dow = d.getDay();
  return CLASSES.filter((c) => c.days[dow] && (!c.onlyDates || c.onlyDates.includes(s)))
    .map((c) => ({ code: c.code, short: c.short, start: c.days[dow][0], end: c.days[dow][1] }))
    .sort((a, b) => a.start - b.start);
};
const clash = (t, dur, c) => t < c.end && t + dur > c.start;
const after = (pref, dur, busy) => {
  let t = pref, moved = null;
  for (let i = 0; i < 8; i++) {
    const c = busy.find((x) => clash(t, dur, x));
    if (!c) break;
    t = c.end + 5; moved = c.short;
  }
  return { t, moved };
};
const before = (pref, dur, busy) => {
  let t = pref, moved = null;
  for (let i = 0; i < 8; i++) {
    const c = busy.find((x) => clash(t, dur, x));
    if (!c) break;
    t = c.start - dur - 10; moved = c.short;
  }
  return { t, moved };
};
const lastEndBefore = (t, busy) => busy.reduce((a, c) => (c.end <= t ? Math.max(a, c.end) : a), -Infinity);

// ================= TRAINING =================

const LIFT_DAYS = [1, 2, 4, 5];

const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

const fmt = (mins) => {
  let h = Math.floor(mins / 60);

  const ap = h >= 12 && h < 24 ? "pm" : "am";

// ================= DAY =================
const buildEvents = (date, offsetMin, liftWeights) => {
  const dow = date.getDay();
  const busy = classesOn(date);
  const w = WORKOUTS[dow];
  const out = [];
  let last = -Infinity;
  const seq = (pref, dur) => {
    const r = after(Math.max(pref, last + 10), dur, busy);
    last = r.t;

  };

  // 85 = 75 min session + travel, so Encounter Mondays push the lift after class

    const r = seq(T(10, 45), 5);
    out.push({ id: "bar", time: r.t, moved: r.moved, title: "Protein Bar", sub: "410 cal · 30g",

    out.push({ id: "mix", time: r.t, moved: r.moved, title: "Peanuts", sub: "320 cal · 8g", steps: ["2 oz peanuts"] });

    out.push({ id: "snack", time: r.t, moved: r.moved, title: "Banana + Peanuts", sub: "275 cal · 8g", steps: ["1 banana", "1 oz peanuts"] });

    // eat as soon as the last class lets out, then train once it settles
    const d = after(Math.max(lastEndBefore(T(23, 59), busy) + 5, T(17, 30)), 30, busy);

    const a = seq(T(16, 15), 5);

};

// ================= THEME =================

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (!this.state.err) return this.props.children;
    return (
      <div style={{ padding: 28 }}>
        <h1 style={S.h1}>Something broke</h1>
        <p style={{ fontSize: 14, color: C.gray, fontWeight: 600 }}>{String(this.state.err && this.state.err.message)}</p>
        <button style={{ ...S.btn, width: "100%", marginTop: 12 }} onClick={() => window.location.reload()}>Reload</button>
      </div>
    );
  }
}

const Chart = ({ pts, sPts, startWeight, startT, rateNow }) => {
  if (pts.length < 2 && sPts.length < 2)
    return <p style={{ fontSize: 13, color: C.gray, margin: 0 }}>Log 2 weigh-ins (or finish 2 workouts) to see the graph.</p>;
  const W = 340, H = 150, P = 14, LBL = 26;
  const times = [...pts.map((p) => p.t), ...sPts.map((p) => p.t)];
  const t0 = Math.min(...times), t1 = Math.max(...times);
  const X = (t) => P + LBL + ((t - t0) / ((t1 - t0) || 1)) * (W - 2 * P - LBL);
  const mk = (arr, key) => {
    if (arr.length < 2) return null;
    const vals = arr.map((p) => p[key]);
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const span = (hi - lo) || 1;
    const Y = (v) => H - P - ((v - lo) / span) * (H - 2 * P) * 0.9 - 6;
    return { lo, hi, Y, poly: arr.map((p) => `${X(p.t)},${Y(p[key])}`).join(" "), dots: arr.map((p) => [X(p.t), Y(p[key])]) };
  };
  const w = mk(pts, "lbs"), s = mk(sPts, "total"), ax = w || s;
  // dashed line = where 1 lb/week says you should be
  let pace = null;
  if (w && startWeight != null && startT != null) {
    const wk = (t) => (t - startT) / (7 * 864e5);
    const a = startWeight + wk(t0) * rateNow, b = startWeight + wk(t1) * rateNow;
    pace = `${X(t0)},${w.Y(a)} ${X(t1)},${w.Y(b)}`;
  }
  return (
    <>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", display: "block" }}>
        {ax && <text x="2" y={ax.Y(ax.hi) + 4} fontSize="10" fontWeight="700" fill={C.gray}>{Math.round(ax.hi)}</text>}
        {ax && <text x="2" y={ax.Y(ax.lo) + 4} fontSize="10" fontWeight="700" fill={C.gray}>{Math.round(ax.lo)}</text>}
        {pace && <polyline points={pace} fill="none" stroke={C.ok} strokeWidth="2" strokeDasharray="5 4" />}
        {s && <polyline points={s.poly} fill="none" stroke={C.warn} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />}
        {s && s.dots.map(([x, y], i) => <circle key={"s" + i} cx={x} cy={y} r="4" fill={C.warn} />)}
        {w && <polyline points={w.poly} fill="none" stroke={C.blue} strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" />}
        {w && w.dots.map(([x, y], i) => <circle key={"w" + i} cx={x} cy={y} r="4.5" fill={C.blue} />)}
      </svg>
      <div style={{ display: "flex", gap: 14, marginTop: 8, flexWrap: "wrap" }}>
        <span style={{ fontSize: 12, fontWeight: 700, color: C.blue }}>● Bodyweight</span>
        <span style={{ fontSize: 12, fontWeight: 700, color: C.warn }}>● Strength</span>
        {pace && <span style={{ fontSize: 12, fontWeight: 700, color: C.ok }}>┄ On pace</span>}
      </div>
    </>
  );
};

const EventCard = ({ e, mark, past, active, weightInput, setWeightInput, onLogWeighIn, onComplete, onToggle, onSkip }) => {
  if (!past && !mark) return null;
  const base = { margin: "10px 14px", borderRadius: 14, border: `2px solid ${C.ink}`, background: "#fff", transition: "all 0.4s ease", overflow: "hidden" };
  if (mark) {
    const skipped = mark === "skip";
    const undoable = e.id !== "lift";
    return (
      <div style={{ ...base, opacity: 0.35, transform: "scale(0.94)", padding: "10px 14px", display: "flex", alignItems: "center", gap: 10, cursor: undoable ? "pointer" : "default" }}
        onClick={undoable ? onToggle : undefined}>
        <span style={{ fontWeight: 900, color: skipped ? C.gray : C.blue }}>{skipped ? "✕" : "✓"}</span>
        <span style={{ fontSize: 14, fontWeight: 700, textDecoration: "line-through" }}>{fmt(e.time)} — {e.title}{skipped ? " (skipped)" : ""}</span>
      </div>
    );
  }
  return (
    <div style={{ ...base, padding: 16, boxShadow: active ? `5px 5px 0 ${C.blue}` : `4px 4px 0 ${C.ink}`, opacity: active ? 1 : 0.75 }}>
      <span style={{ fontFamily: "'Courier New', monospace", fontWeight: 700, fontSize: 13, color: active ? C.blue : C.gray }}>
        {fmt(e.time)} {active ? "· NOW" : "· catch up"}{e.moved ? ` · after ${e.moved}` : ""}
      </span>
      <h2 style={{ fontSize: 22, fontWeight: 900, margin: "4px 0 2px", letterSpacing: "-0.02em" }}>{e.title}</h2>
      {e.sub && <p style={{ fontSize: 13, color: C.gray, margin: "0 0 10px", fontWeight: 600 }}>{e.sub}</p>}
      <ol style={{ margin: "8px 0 0", paddingLeft: 20 }}>
        {e.steps.map((s, i) => <li key={i} style={{ fontSize: 15, lineHeight: 1.5, marginBottom: 4 }}>{s}</li>)}
      </ol>
      {e.id === "weighin" && (
        <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
          <input style={S.input} type="number" inputMode="decimal" placeholder="lbs" value={weightInput} onChange={(ev) => setWeightInput(ev.target.value)} />
          <button style={S.btn} onClick={onLogWeighIn}>Log ✓</button>
        </div>
      )}
      {e.id === "lift" && (
        <div style={{ marginTop: 14 }}>
          <button style={{ ...S.btn, width: "100%" }} onClick={() => onComplete(true)}>Hit top of every range ✓</button>
          <button style={{ ...S.btn, width: "100%", marginTop: 8, background: "#fff", color: C.ink }} onClick={() => onComplete(false)}>Fell short</button>
        </div>
      )}
      {e.id !== "weighin" && e.id !== "lift" && <button style={{ ...S.btn, width: "100%", marginTop: 14 }} onClick={onToggle}>Done ✓</button>}
      <button style={{ width: "100%", marginTop: 6, padding: 10, background: "none", border: "none", color: C.gray, fontWeight: 700, fontSize: 13, cursor: "pointer" }} onClick={onSkip}>Skip today</button>
    </div>
  );
};

// ================= APP =================
function GainCoach() {
  const [tab, setTab] = useState("home");
  const [clock, setClock] = useState(() => new Date());
  const [state, setState] = useState({
    checks: {}, checksDate: todayKey(), startWeight: null, weights: [], offsetMin: 25,
    notifOn: false, liftWeights: { ...DEFAULT_WEIGHTS }, streak: 0, lastFullDay: null,
    startDate: null, startLifts: null, totals: { cal: 0, protein: 0, workouts: 0 },
    pantry: { ...FULL_PANTRY }, liftHistory: [],
  });
  const [toast, setToast] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [weightInput, setWeightInput] = useState("");
  const [startInput, setStartInput] = useState("");
  const [range, setRange] = useState("ALL");
  const [liftTab, setLiftTab] = useState(1);
  const [openLift, setOpenLift] = useState(null);
  const notified = useRef({});
  const toastTimer = useRef(null);
  const scrollRef = useRef(null);

  const nowMin = clock.getHours() * 60 + clock.getMinutes();
  const day = clock.getDay();
  const todayWorkout = WORKOUTS[day];
  const todayClasses = useMemo(() => classesOn(clock), [clock.toDateString()]);

  useEffect(() => {
    (async () => {
      try {
        let raw = null;
        try { raw = (await window.storage.get(SAVE_KEY)).value; } catch (e) {}
        if (raw) {
          const s = JSON.parse(raw);
          if (s.checksDate !== todayKey()) {
            s.checks = {}; s.checksDate = todayKey();
            if (s.lastFullDay !== yesterdayKey() && s.lastFullDay !== todayKey()) s.streak = 0;
          }
          setState((p) => ({ ...p, ...s,
            liftWeights: { ...DEFAULT_WEIGHTS, ...(s.liftWeights || {}) },
            pantry: { ...FULL_PANTRY, ...(s.pantry || {}) },
            totals: { cal: 0, protein: 0, workouts: 0, ...(s.totals || {}) } }));
        } else {
          // carry the only things worth keeping from the pre-v4 plan
          try {
            const old = JSON.parse((await window.storage.get(OLD_KEY)).value);
            setState((p) => ({ ...p,
              weights: old.weights || [], startWeight: old.startWeight ?? null,
              startDate: old.startDate || null,
              totals: { cal: 0, protein: 0, workouts: old.totals?.workouts || 0 } }));
          } catch (e) {}
        }
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    window.storage.set(SAVE_KEY, JSON.stringify(state)).catch((e) => console.error(e));
  }, [state, loaded]);

  useEffect(() => { const t = setInterval(() => setClock(new Date()), 20000); return () => clearInterval(t); }, []);
  useEffect(() => {
    if (!loaded) return;
    const k = todayKey();
    setState((p) => {
      if (p.checksDate === k) return p;
      const streak = p.lastFullDay === yesterdayKey() || p.lastFullDay === k ? p.streak : 0;
      return { ...p, checks: {}, checksDate: k, streak };
    });
  }, [loaded, clock.toDateString()]);
  useEffect(() => () => clearTimeout(toastTimer.current), []);
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = 0; }, [tab]);

  const events = useMemo(() => buildEvents(clock, state.offsetMin, state.liftWeights),
    [clock.toDateString(), state.offsetMin, state.liftWeights]);

  useEffect(() => {
    if (!state.notifOn || typeof Notification === "undefined" || Notification.permission !== "granted") return;
    events.forEach((e) => {
      const k = e.id + todayKey();
      if (nowMin >= e.time && nowMin - e.time <= 45 && !state.checks[e.id] && !notified.current[k]) {
        notified.current[k] = true;
        try { new Notification("⏰ " + e.title, { body: e.steps[0] }); } catch (err) {}
      }
    });
  }, [nowMin, state.notifOn, state.checks, events]);

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2500);
  };

  const isResolved = (checks, id) => checks[id] === true || checks[id] === "skip";
  // The streak runs off the FLOOR, not a perfect day. A streak you can only
  // keep by being perfect is a streak you abandon the first time you slip.
  const applyStreak = (next) => {
    const floor = FLOOR_EVENTS.every((id) => next.checks[id] === true);
    return floor && next.lastFullDay !== todayKey()
      ? { ...next, streak: (next.streak || 0) + 1, lastFullDay: todayKey() }
      : next;
  };

  const toggleCheck = (id) => {
    if (state.checks[id] !== true) showToast(TOASTS[id] || "Done ✓");
    setState((prev) => {
      const was = prev.checks[id] === true;
      const dir = was ? -1 : 1;
      const totals = { ...prev.totals };
      totals.cal = Math.max(0, (totals.cal || 0) + dir * (CALS[id] || 0));
      totals.protein = Math.max(0, (totals.protein || 0) + dir * (PROT[id] || 0));
      const pantry = { ...prev.pantry };
      Object.entries(CONSUME[id] || {}).forEach(([k, v]) => {
        pantry[k] = Math.min(FULL_PANTRY[k], Math.max(0, (pantry[k] ?? FULL_PANTRY[k]) - dir * v));
      });
      return applyStreak({ ...prev, checks: { ...prev.checks, [id]: !was }, checksDate: todayKey(), totals, pantry });
    });
  };

  const completeLift = (success) => {
    if (state.checks.lift === true || !todayWorkout) return;
    showToast(success ? "Logged — weight goes up next time 🏋️" : "Logged. Same weight next time 💪");
    setState((prev) => {
      if (prev.checks.lift === true) return prev;
      let liftWeights = prev.liftWeights;
      if (success) {
        liftWeights = { ...prev.liftWeights };
        todayWorkout.lifts.forEach((l) => { if (l.inc > 0) liftWeights[l.id] = (liftWeights[l.id] || 0) + l.inc; });
      }
      const total = BIG_FIVE.reduce((a, k) => a + (liftWeights[k] || 0), 0);
      return applyStreak({ ...prev,
        checks: { ...prev.checks, lift: true }, checksDate: todayKey(),
        totals: { ...prev.totals, workouts: (prev.totals.workouts || 0) + 1 },
        liftWeights,
        liftHistory: [...(prev.liftHistory || []), { t: Date.now(), total }] });
    });
  };

  const skipEvent = (id) => setState((prev) => applyStreak({ ...prev, checks: { ...prev.checks, [id]: "skip" }, checksDate: todayKey() }));

  const logWeight = (alsoCheck) => {
    const lbs = parseFloat(weightInput);
    if (!lbs || lbs <= 0) return;
    showToast(TOASTS.weighin);
    setState((prev) => {
      const next = { ...prev, weights: [...prev.weights, { t: Date.now(), lbs }], startWeight: prev.startWeight == null ? lbs : prev.startWeight };
      if (!alsoCheck) return next;
      next.checks = { ...prev.checks, weighin: true };
      next.checksDate = todayKey();
      return applyStreak(next);
    });
    setWeightInput("");
  };

  const setStart = () => {
    const lbs = parseFloat(startInput);
    if (!lbs || lbs <= 0) return;
    setState((p) => ({ ...p, startWeight: lbs }));
    setStartInput("");
  };
  const setLift = (id, val) => {
    const v = parseFloat(val);
    if (isNaN(v)) return;
    setState((p) => ({ ...p, liftWeights: { ...p.liftWeights, [id]: v } }));
  };
  const restock = (item) => {
    setState((p) => ({ ...p, pantry: { ...p.pantry, [item.id]: item.pkg } }));
    showToast(`${item.name} restocked 🛒`);
  };
  const startPlan = () => setState((p) => ({ ...p, startDate: new Date().toISOString().slice(0, 10), startLifts: { ...p.liftWeights } }));
  const toggleNotifs = async () => {
    if (state.notifOn) { setState((s) => ({ ...s, notifOn: false })); showToast("Notifications off"); return; }
    if (typeof Notification === "undefined") { alert("Notifications aren't supported here."); return; }
    let perm = Notification.permission;
    if (perm === "default") perm = await Notification.requestPermission();
    if (perm !== "granted") { alert("Notifications are blocked for GAINS. Turn them back on in iPhone Settings → Notifications → GAINS."); return; }
    setState((s) => ({ ...s, notifOn: true }));
    showToast("Notifications on 🔔");
  };

  // ---- derived ----
  const rangeMs = { "1M": 30 * 864e5, "3M": 90 * 864e5, ALL: Infinity }[range];
  const cutoff = Date.now() - rangeMs;
  const pts = state.weights.filter((p) => p.t >= cutoff);
  const sPts = (state.liftHistory || []).filter((p) => p.t >= cutoff);
  const latest = state.weights.length ? state.weights[state.weights.length - 1].lbs : null;
  const delta = latest != null && state.startWeight != null ? (latest - state.startWeight).toFixed(1) : null;
  const startT = state.weights.length ? state.weights[0].t : null;
  const dayN = state.startDate ? Math.floor((Date.now() - new Date(state.startDate).getTime()) / 864e5) + 1 : null;
  const weekN = dayN ? Math.floor((dayN - 1) / 7) + 1 : null;

  const calsToday = events.reduce((a, e) => a + (state.checks[e.id] === true ? CALS[e.id] || 0 : 0), 0);
  const protToday = events.reduce((a, e) => a + (state.checks[e.id] === true ? PROT[e.id] || 0 : 0), 0);
  const doneCount = events.filter((e) => state.checks[e.id] === true).length;
  const resolvedCount = events.filter((e) => isResolved(state.checks, e.id)).length;
  const firstLive = events.find((x) => nowMin >= x.time && !state.checks[x.id]);
  const floorDone = FLOOR_EVENTS.filter((id) => state.checks[id] === true).length;

  // phase is detected from strength progression, never from the calendar
  const stalled = strengthStalled(state.liftHistory);
  const phase = stalled ? "intermediate" : "novice";
  const rateNow = RATE[phase];
  const bw = latest ?? state.startWeight ?? 140;
  const calTarget = calTargetFor(bw, rateNow);
  const proteinTarget = proteinFor(bw);
  const calGap = calTarget - BASE_DAY_CAL;

  // pace: where the current rate says you should be by now
  let pace = null;
  if (state.startWeight != null && startT != null && latest != null && state.weights.length >= 2) {
    const wks = (Date.now() - startT) / (7 * 864e5);
    const should = state.startWeight + wks * rateNow;
    pace = { should, diff: latest - should, wks };
  }

  const lowItems = PANTRY.filter((i) => (state.pantry?.[i.id] ?? i.pkg) / i.perDay <= (i.lowAt ?? 3));
  const nextUp = events.find((e) => nowMin < e.time);

  if (!loaded) return <div className="app"><div className="scroll" style={{ padding: 40, textAlign: "center", fontWeight: 700 }}>Loading…</div></div>;

  return (
    <div className="app">
      <div className="scroll" ref={scrollRef}>
        {toast && (
          <div style={{ position: "fixed", top: "calc(env(safe-area-inset-top) + 12px)", left: 14, right: 14, maxWidth: 452, margin: "0 auto", background: C.ink, color: "#fff", padding: "12px 20px", borderRadius: 12, fontWeight: 800, fontSize: 15, zIndex: 99, boxShadow: "0 4px 14px rgba(0,0,0,0.3)", textAlign: "center" }}>{toast}</div>
        )}

        {tab === "home" && (
          <>
            <div style={S.header}>
              {dayN && <div style={{ fontSize: 15, fontWeight: 900, letterSpacing: "0.1em", color: C.blue, textTransform: "uppercase", marginBottom: 2 }}>Day {dayN} · Week {weekN}</div>}
              <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: "0.14em", color: C.gray, textTransform: "uppercase" }}>
                {DAYS[day]} · {fmt(nowMin)}{state.streak > 0 ? ` · 🔥 ${state.streak}` : ""}
              </div>
              <h1 style={S.h1}>{todayWorkout ? todayWorkout.name : "Rest & Eat"}</h1>
              {todayClasses.length > 0 && (
                <div style={{ fontSize: 12, fontWeight: 700, color: C.gray, marginTop: 4 }}>
                  {todayClasses.map((c) => `${c.code} ${fmt(c.start)}`).join(" · ")}
                </div>
              )}
              <div style={{ height: 8, borderRadius: 4, background: C.line, marginTop: 10, overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${Math.min(100, (calsToday / calTarget) * 100)}%`, background: C.blue, transition: "width 0.5s ease" }} />
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, fontWeight: 800, marginTop: 6 }}>
                <span>{calsToday.toLocaleString()} / {calTarget.toLocaleString()} cal</span>
                <span style={{ color: protToday >= proteinTarget ? C.ok : C.gray }}>{protToday} / {proteinTarget}g protein</span>
              </div>
            </div>

            {!state.startDate && (
              <div style={{ ...S.card, textAlign: "center" }}>
                <p style={{ fontSize: 15, fontWeight: 700, margin: "0 0 12px" }}>Ready to begin?</p>
                <button style={{ ...S.btn, width: "100%", fontSize: 17 }} onClick={startPlan}>🚀 Start Day 1</button>
              </div>
            )}

            {floorDone < 3 && (
              <div style={S.banner(floorDone === 3 ? C.ok : C.gray, "#fff")}>
                Floor {floorDone}/3 — bar, breakfast, last feed. Hit these and today counts, whatever else happens.
              </div>
            )}
            {floorDone === 3 && <div style={S.banner(C.ok, "#EAF5EE")}>✓ Floor hit. Today counts.</div>}

            {stalled && (
              <div style={S.banner(C.warn, "#FDF1EA")}>
                No new strength PR in 3 weeks — you've likely left the novice phase.
                Rate dropped to 0.5 lb/week ({calTarget.toLocaleString()} cal). Same surplus would just be fat now.
              </div>
            )}

            {calGap > 120 && (
              <div style={S.banner(C.blue, "#EEF1FE")}>
                You're {bw} lb now — target is {calTarget.toLocaleString()} cal. Add {Math.round(calGap / 100) * 100} on top of the day below (1 PB spoon ≈ 95, 1 cup milk ≈ 150).
              </div>
            )}

            {pace && Math.abs(pace.diff) > 1.5 && (
              <div style={S.banner(pace.diff < 0 ? C.warn : C.blue, pace.diff < 0 ? "#FDF1EA" : "#EEF1FE")}>
                {pace.diff < 0
                  ? `${Math.abs(pace.diff).toFixed(1)} lb behind pace — add 300 cal/day (1 more PB spoon + a cup of milk)`
                  : `${pace.diff.toFixed(1)} lb ahead of pace — ease off 200 cal if it keeps climbing`}
              </div>
            )}

            {lowItems.length > 0 && (
              <div style={{ ...S.banner(C.warn, "#FDF1EA"), cursor: "pointer" }} onClick={() => setTab("fridge")}>
                🛒 Running low: {lowItems.map((i) => i.name).join(", ")}
              </div>
            )}

            {events.map((e) => (
              <EventCard key={e.id} e={e} mark={state.checks[e.id]} past={nowMin >= e.time}
                active={!!firstLive && firstLive.id === e.id}
                weightInput={weightInput} setWeightInput={setWeightInput}
                onLogWeighIn={() => logWeight(true)} onComplete={completeLift}
                onToggle={() => toggleCheck(e.id)} onSkip={() => skipEvent(e.id)} />
            ))}

            {nextUp && (
              <div style={{ margin: "10px 14px", padding: "12px 16px", borderRadius: 12, border: `2px dashed ${C.gray}`, color: C.gray, fontSize: 14, fontWeight: 700 }}>
                Up next · {fmt(nextUp.time)} — {nextUp.title} (in {Math.floor((nextUp.time - nowMin) / 60)}h {(nextUp.time - nowMin) % 60}m)
              </div>
            )}
            {!nextUp && resolvedCount === events.length && (
              <div style={{ ...S.card, textAlign: "center", fontWeight: 900, fontSize: 18 }}>Day complete. 💪</div>
            )}
          </>
        )}

        {tab === "lifts" && (
          <>
            <div style={S.header}><h1 style={S.h1}>Lifts</h1></div>
            <div style={{ display: "flex", gap: 6, margin: "0 14px 4px" }}>
              {LIFT_DAYS.map((d) => (
                <button key={d} onClick={() => { setLiftTab(d); setOpenLift(null); }}
                  style={{ flex: 1, padding: "10px 2px", fontWeight: 900, fontSize: 12, borderRadius: 10, border: `2px solid ${C.ink}`, background: liftTab === d ? C.blue : "#fff", color: liftTab === d ? "#fff" : C.ink, cursor: "pointer" }}>
                  {WORKOUTS[d].name}
                </button>
              ))}
            </div>
            <div style={{ margin: "8px 14px 0", fontSize: 12, fontWeight: 700, color: C.gray }}>{DAYS[liftTab]} · {WORKOUTS[liftTab].lifts.length} exercises</div>
            {WORKOUTS[liftTab].lifts.map((l) => {
              const open = openLift === l.id;
              const src = videoSrc(l.id);
              return (
                <div key={l.id} style={{ ...S.card, padding: 0, overflow: "hidden" }}>
                  <div onClick={() => setOpenLift(open ? null : l.id)} style={{ padding: 16, display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }}>
                    <div>
                      <div style={{ fontWeight: 800, fontSize: 16 }}>{l.name}</div>
                      <div style={{ fontSize: 13, color: C.gray, fontWeight: 600 }}>{l.sets}×{l.reps}{NO_WEIGHT.includes(l.id) ? "" : ` @ ${state.liftWeights[l.id]} lbs`}</div>
                    </div>
                    <span style={{ fontWeight: 900, fontSize: 18, color: C.blue }}>{open ? "▲" : "▶"}</span>
                  </div>
                  {open && src && (
                    <div style={{ borderTop: `2px solid ${C.ink}` }}>
                      <iframe src={src} style={{ width: "100%", aspectRatio: "16/9", border: "none", display: "block" }}
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen title={l.name} />
                    </div>
                  )}
                  {open && !src && (
                    <div style={{ borderTop: `2px solid ${C.ink}`, padding: 14 }}>
                      <a href={videoSearch(l.name)} target="_blank" rel="noopener" style={{ ...S.btn, display: "block", textAlign: "center", textDecoration: "none" }}>▶️ Form video</a>
                    </div>
                  )}
                </div>
              );
            })}
          </>
        )}

        {tab === "fridge" && (
          <>
            <div style={S.header}><h1 style={S.h1}>Fridge</h1></div>
            {PANTRY.map((item) => {
              const left = state.pantry?.[item.id] ?? item.pkg;
              const days = left / item.perDay;
              const low = days <= (item.lowAt ?? 3);
              return (
                <div key={item.id} style={{ ...S.card, borderColor: low ? C.warn : C.ink }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8 }}>
                    <span style={{ fontWeight: 800, fontSize: 16 }}>{item.name}</span>
                    <span style={{ fontSize: 13, fontWeight: 700, color: low ? C.warn : C.gray, whiteSpace: "nowrap" }}>
                      {low ? "⚠️ " : ""}{Math.max(0, Math.round(days))} days left
                    </span>
                  </div>
                  <div style={{ height: 8, borderRadius: 4, background: C.line, margin: "10px 0", overflow: "hidden" }}>
                    <div style={{ height: "100%", width: `${Math.min(1, left / item.pkg) * 100}%`, background: low ? C.warn : C.blue, transition: "width 0.4s" }} />
                  </div>
                  <div style={{ fontSize: 13, color: C.gray, marginBottom: 4 }}>~{Math.round(left * 10) / 10} {item.unit} left</div>
                  <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10 }}>{item.where} · ~${item.price}</div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button style={{ ...S.btn, flex: 1, padding: 10 }} onClick={() => restock(item)}>Bought ✓</button>
                    <a href={item.buy} target="_blank" rel="noopener" style={{ ...S.btn, flex: 1, padding: 10, background: "#fff", color: C.ink, textAlign: "center", textDecoration: "none" }}>🎯 Target</a>
                  </div>
                </div>
              );
            })}
            <div style={S.card}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 15, fontWeight: 700, marginBottom: 6 }}>
                <span>Restock low</span><span style={{ color: C.warn }}>~${lowItems.reduce((a, i) => a + i.price, 0)}</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 15, fontWeight: 700 }}>
                <span>Full week</span><span style={{ color: C.blue }}>~${PANTRY.reduce((a, i) => a + i.price, 0)}</span>
              </div>
            </div>
          </>
        )}

        {tab === "progress" && (
          <>
            <div style={S.header}><h1 style={S.h1}>Progress</h1></div>
            <div style={S.card}>
              {state.startWeight == null ? (
                <>
                  <p style={S.label}>Starting weight</p>
                  <div style={{ display: "flex", gap: 10 }}>
                    <input style={S.input} type="number" inputMode="decimal" placeholder="lbs" value={startInput} onChange={(ev) => setStartInput(ev.target.value)} />
                    <button style={S.btn} onClick={setStart}>Set</button>
                  </div>
                </>
              ) : (
                <div style={{ display: "flex", justifyContent: "space-between", textAlign: "center" }}>
                  {[["Start", state.startWeight], ["Now", latest ?? "—"], ["Gained", delta != null ? (delta > 0 ? "+" : "") + delta : "—"], ["Goal", state.startWeight + 13]].map(([k, v], i) => (
                    <div key={k}>
                      <div style={{ fontSize: 11, fontWeight: 800, color: C.gray, textTransform: "uppercase" }}>{k}</div>
                      <div style={{ fontSize: 24, fontWeight: 900, color: i === 2 ? C.blue : C.ink }}>{v}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {pace && (
              <div style={S.card}>
                <p style={S.label}>Pace · target 1 lb/week</p>
                <div style={{ fontSize: 15, fontWeight: 700, lineHeight: 1.5 }}>
                  Week {pace.wks.toFixed(1)}. You should be at <b>{pace.should.toFixed(1)}</b>, you're at <b>{latest}</b>.
                </div>
                <div style={{ fontSize: 22, fontWeight: 900, marginTop: 6, color: Math.abs(pace.diff) <= 1.5 ? C.ok : pace.diff < 0 ? C.warn : C.blue }}>
                  {Math.abs(pace.diff) <= 1.5 ? "On pace ✓" : pace.diff < 0 ? `${Math.abs(pace.diff).toFixed(1)} lb behind` : `${pace.diff.toFixed(1)} lb ahead`}
                </div>
              </div>
            )}

            <div style={S.card}>
              <p style={S.label}>Log today's weight</p>
              <div style={{ display: "flex", gap: 10 }}>
                <input style={S.input} type="number" inputMode="decimal" placeholder="lbs" value={weightInput} onChange={(ev) => setWeightInput(ev.target.value)} />
                <button style={S.btn} onClick={() => logWeight(false)}>Log</button>
              </div>
            </div>

            <div style={S.card}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <p style={{ ...S.label, margin: 0 }}>Growth chart</p>
                <div style={{ display: "flex", gap: 4 }}>
                  {["1M", "3M", "ALL"].map((r) => (
                    <button key={r} onClick={() => setRange(r)} style={{ padding: "5px 9px", fontSize: 11, fontWeight: 800, borderRadius: 8, border: `2px solid ${C.ink}`, background: range === r ? C.blue : "#fff", color: range === r ? "#fff" : C.ink, cursor: "pointer" }}>{r}</button>
                  ))}
                </div>
              </div>
              <Chart pts={pts} sPts={sPts} startWeight={state.startWeight} startT={startT} rateNow={rateNow} />
            </div>

            <div style={S.card}>
              <p style={S.label}>Novice → intermediate</p>
              <p style={{ fontSize: 13, color: C.gray, margin: "0 0 10px", lineHeight: 1.5 }}>
                Strength relative to your {bw} lb bodyweight. Hitting these, or stalling for 3 weeks, is what ends the novice phase — not the calendar.
              </p>
              {STANDARDS.map((st) => {
                const now = state.liftWeights[st.id] || 0;
                const goal = Math.round(bw * st.mult);
                const pct = Math.min(1, now / goal);
                return (
                  <div key={st.id} style={{ marginBottom: 10 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, fontWeight: 700 }}>
                      <span>{st.name}</span>
                      <span style={{ color: now >= goal ? C.ok : C.gray }}>{now} / {goal} lb</span>
                    </div>
                    <div style={{ height: 6, borderRadius: 3, background: C.line, marginTop: 4, overflow: "hidden" }}>
                      <div style={{ height: "100%", width: `${pct * 100}%`, background: now >= goal ? C.ok : C.blue }} />
                    </div>
                  </div>
                );
              })}
              <div style={{ fontSize: 13, fontWeight: 800, marginTop: 10, color: phase === "novice" ? C.blue : C.warn }}>
                Currently: {phase === "novice" ? "novice — adding weight weekly, gain at 1 lb/wk" : "intermediate — progression stalled, gain at 0.5 lb/wk"}
              </div>
            </div>

            <div style={S.card}>
              <p style={S.label}>All-time</p>
              <div style={{ display: "flex", justifyContent: "space-between", textAlign: "center" }}>
                {[["Workouts", state.totals?.workouts || 0], ["Streak", `🔥${state.streak || 0}`], ["Weigh-ins", state.weights.length]].map(([k, v]) => (
                  <div key={k}>
                    <div style={{ fontSize: 11, fontWeight: 800, color: C.gray, textTransform: "uppercase" }}>{k}</div>
                    <div style={{ fontSize: 22, fontWeight: 900 }}>{v}</div>
                  </div>
                ))}
              </div>
            </div>

            <div style={S.card}>
              <p style={S.label}>Current lift numbers</p>
              {ALL_LIFTS.filter((l) => !NO_WEIGHT.includes(l.id)).map((l) => (
                <div key={l.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: `1px solid ${C.line}` }}>
                  <span style={{ fontWeight: 600, fontSize: 14 }}>
                    {l.name}
                    {state.startLifts && state.liftWeights[l.id] > (state.startLifts[l.id] ?? 0) && (
                      <span style={{ color: C.blue, fontWeight: 900, fontSize: 13 }}> +{state.liftWeights[l.id] - state.startLifts[l.id]}</span>
                    )}
                  </span>
                  <input key={`${l.id}:${state.liftWeights[l.id]}`} type="number" inputMode="decimal"
                    defaultValue={state.liftWeights[l.id]} onBlur={(ev) => setLift(l.id, ev.target.value)}
                    style={{ width: 74, padding: "6px 8px", fontSize: 15, fontWeight: 700, border: `2px solid ${C.ink}`, borderRadius: 8, textAlign: "right" }} />
                </div>
              ))}
            </div>
          </>
        )}

        {tab === "settings" && (
          <>
            <div style={S.header}><h1 style={S.h1}>Settings</h1></div>
            <div style={S.card}>
              <p style={S.label}>The plan</p>
              <div style={{ fontSize: 14, lineHeight: 1.7 }}>
                <div><b>{calTarget.toLocaleString()}</b> cal/day · <b>{proteinTarget}g</b> protein</div>
                <div><b>{rateNow} lb/week</b> · phase: <b>{phase}</b></div>
                <div>4 lifts/week · 10–20 sets per muscle</div>
                <div style={{ fontSize: 12, color: C.gray, marginTop: 8, lineHeight: 1.5 }}>
                  Target recalculates off your logged bodyweight. The rate drops to 0.5 lb/week only when your strength stalls for 3 weeks — typically 6–12 months in, not on a fixed date.
                </div>
              </div>
            </div>
            <div style={S.card}>
              <p style={S.label}>Gym heads-up</p>
              <p style={{ fontSize: 14, margin: "0 0 8px" }}>Alert me <b>{state.offsetMin} min</b> before</p>
              <input type="range" min="0" max="90" step="5" value={state.offsetMin} onChange={(ev) => { const v = parseInt(ev.target.value); setState((p) => ({ ...p, offsetMin: v })); }} style={{ width: "100%" }} />
            </div>
            <div style={S.card}>
              <p style={S.label}>Notifications</p>
              <button style={{ ...S.btn, width: "100%", background: state.notifOn ? "#fff" : C.blue, color: state.notifOn ? C.ink : "#fff" }} onClick={toggleNotifs}>
                {state.notifOn ? "Turn off notifications" : "Turn on notifications"}
              </button>
            </div>
            <div style={S.card}>
              <p style={S.label}>Starting weight</p>
              <div style={{ display: "flex", gap: 10 }}>
                <input style={S.input} type="number" inputMode="decimal" placeholder={state.startWeight ? `${state.startWeight} lbs` : "lbs"} value={startInput} onChange={(ev) => setStartInput(ev.target.value)} />
                <button style={S.btn} onClick={setStart}>Save</button>
              </div>
            </div>
            <div style={S.card}>
              <p style={S.label}>Week</p>
              {[1, 2, 3, 4, 5].map((d) => {
                const cs = CLASSES.filter((c) => c.days[d]).map((c) => `${c.code} ${fmt(c.days[d][0])}`);
                return <div key={d} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px solid ${C.line}`, fontSize: 13, gap: 10 }}>
                  <b>{DAYS[d]}{WORKOUTS[d] ? ` · ${WORKOUTS[d].name}` : ""}</b>
                  <span style={{ color: C.gray, textAlign: "right" }}>{cs.length ? cs.join(" · ") : "—"}</span>
                </div>;
              })}
            </div>
          </>
        )}
      </div>

      <nav className="tabbar">
        {[["home", "Today"], ["lifts", "Lifts"], ["fridge", "Fridge"], ["progress", "Stats"], ["settings", "More"]].map(([k, lbl]) => (
          <button key={k} style={S.tabBtn(tab === k)} onClick={() => setTab(k)}>{lbl}</button>
        ))}
      </nav>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><GainCoach /></ErrorBoundary>);
</script>
</body>
</html>
